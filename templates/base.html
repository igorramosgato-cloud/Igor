<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Planejamento Financeiro{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #666;
      --border: #e0e0e0;
      --accent: #2f6f4f;
      --accent-fg: #ffffff;
      --danger: #a4351f;
      --danger-bg: #fbeae7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2226;
        --text: #eaeaea;
        --muted: #9a9a9a;
        --border: #333;
        --accent: #4caf7d;
        --accent-fg: #0c130f;
        --danger: #ff8a75;
        --danger-bg: #3a1f1a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    nav {
      display: flex;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      opacity: 0.75;
    }
    nav a.active { opacity: 1; color: var(--accent); }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.75rem;
    }
    input {
      width: 100%;
      padding: 0.5rem 0.6rem;
      margin-top: 0.25rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    button {
      margin-top: 1.25rem;
      padding: 0.65rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: right; padding: 0.4rem 0.3rem; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child { text-align: left; }
    .erro {
      background: var(--danger-bg);
      color: var(--danger);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .aviso { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; }
    .resultado dt { color: var(--muted); font-size: 0.85rem; margin-top: 0.6rem; }
    .resultado dd { margin: 0; font-size: 1.1rem; font-weight: 600; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('meta') }}" class="{{ 'active' if request.endpoint == 'meta' else '' }}">Meta</a>
    <a href="{{ url_for('historico') }}" class="{{ 'active' if request.endpoint == 'historico' else '' }}">Histórico</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
